# Isolated S1 verification. scripts/verify-s1.ps1 supplies a unique project name.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: jobassistant_test
      POSTGRES_DB: jobassistant_test
      POSTGRES_PASSWORD: ${VERIFY_DB_PASSWORD:?verification password is required}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobassistant_test -d jobassistant_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      com.job-assistant.scope: s1-verification
  api:
    image: ${COMPOSE_PROJECT_NAME}-api
    build:
      context: ../backend
      args:
        GOPROXY: ${VERIFY_GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: postgres://jobassistant_test:${VERIFY_DB_PASSWORD}@db:5432/jobassistant_test?sslmode=disable
      CSRF_SECRET: ${VERIFY_CSRF_SECRET:?verification CSRF key is required}
      APP_ENV: development
      APP_ORIGIN: http://localhost:${VERIFY_HTTP_PORT:-18080}
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:${VERIFY_HTTP_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.job-assistant.scope: s1-verification
  admin:
    image: ${COMPOSE_PROJECT_NAME}-api
    entrypoint: ["/app/admin"]
    command: ["migrate"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://jobassistant_test:${VERIFY_DB_PASSWORD}@db:5432/jobassistant_test?sslmode=disable
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${VERIFY_ADMIN_PASSWORD:?verification admin password is required}
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.job-assistant.scope: s1-verification
  verifier:
    image: ${COMPOSE_PROJECT_NAME}-tests
    build:
      context: ../backend
      target: verify
      args:
        GOPROXY: ${VERIFY_GOPROXY:-https://proxy.golang.org,direct}
    profiles: ["tests"]
    environment:
      TEST_DATABASE_URL: postgres://jobassistant_test:${VERIFY_DB_PASSWORD}@db:5432/jobassistant_test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.job-assistant.scope: s1-verification
