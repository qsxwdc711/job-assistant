name: job-assistant
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobassistant}
      POSTGRES_DB: ${POSTGRES_DB:-jobassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    image: job-assistant-local
    build:
      context: ../backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      APP_ENV: ${APP_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      HTTP_ADDR: ":8080"
      PRIVATE_STORAGE_DIR: /app/private
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-flash}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      - private_files:/app/private
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: job-assistant-local
    build:
      context: ../backend
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_ENV: ${APP_ENV:-production}
      PRIVATE_STORAGE_DIR: /app/private
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-flash}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      - private_files:/app/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  admin:
    image: job-assistant-local
    build:
      context: ../backend
    entrypoint: ["/app/admin"]
    command: ["migrate"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
  collector:
    image: job-assistant-local
    build:
      context: ../backend
    entrypoint: ["/app/collector"]
    command: ["all"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HTTP_PROXY: ${COLLECTOR_HTTP_PROXY:-}
      HTTPS_PROXY: ${COLLECTOR_HTTPS_PROXY:-}
      NO_PROXY: db,localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  private_files:
